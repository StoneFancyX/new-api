name: Publish Docker image (alpha)

on:
  push:
    branches:
      - alpha
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (default: auto-generated)'
        required: false
        default: ''
      push_image:
        description: 'Push image to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # ARM runners require public repositories - disabled for private repos
          # - arch: arm64
          #   platform: linux/arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine alpha version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            VERSION="alpha-${{ github.event.inputs.version_suffix }}"
          else
            VERSION="alpha-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          fi
          echo "$VERSION" > VERSION
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION for ${{ matrix.arch }}"

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            stonefancyx/new-api
            ghcr.io/${{ env.GHCR_REPOSITORY }}

      - name: Build & push single-arch (to both registries)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: |
            stonefancyx/new-api:alpha-${{ matrix.arch }}
            stonefancyx/new-api:${{ steps.version.outputs.value }}-${{ matrix.arch }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:alpha-${{ matrix.arch }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests (Docker Hub + GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Determine alpha version
        id: version
        run: |
          VERSION="alpha-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - alpha)
        run: |
          # For single-arch builds, just retag the image
          docker pull stonefancyx/new-api:alpha-amd64
          docker tag stonefancyx/new-api:alpha-amd64 stonefancyx/new-api:alpha
          docker push stonefancyx/new-api:alpha

      - name: Create & push manifest (Docker Hub - versioned alpha)
        run: |
          # For single-arch builds, just retag the image
          docker pull stonefancyx/new-api:${VERSION}-amd64
          docker tag stonefancyx/new-api:${VERSION}-amd64 stonefancyx/new-api:${VERSION}
          docker push stonefancyx/new-api:${VERSION}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (GHCR - alpha)
        run: |
          # For single-arch builds, just retag the image
          docker pull ghcr.io/${GHCR_REPOSITORY}:alpha-amd64
          docker tag ghcr.io/${GHCR_REPOSITORY}:alpha-amd64 ghcr.io/${GHCR_REPOSITORY}:alpha
          docker push ghcr.io/${GHCR_REPOSITORY}:alpha

      - name: Create & push manifest (GHCR - versioned alpha)
        run: |
          # For single-arch builds, just retag the image
          docker pull ghcr.io/${GHCR_REPOSITORY}:${VERSION}-amd64
          docker tag ghcr.io/${GHCR_REPOSITORY}:${VERSION}-amd64 ghcr.io/${GHCR_REPOSITORY}:${VERSION}
          docker push ghcr.io/${GHCR_REPOSITORY}:${VERSION}
